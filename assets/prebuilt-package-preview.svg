<svg width="1200" height="900" viewBox="0 0 1200 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="60" x2="1080" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131A"/>
      <stop offset="1" stop-color="#0B1F28"/>
    </linearGradient>
    <linearGradient id="panel" x1="360" y1="220" x2="840" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17232A"/>
      <stop offset="1" stop-color="#0F171D"/>
    </linearGradient>
    <linearGradient id="accent" x1="390" y1="260" x2="810" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D5E5"/>
      <stop offset="1" stop-color="#0EA5B5"/>
    </linearGradient>
    <linearGradient id="amber" x1="410" y1="290" x2="790" y2="620" gradientUnits="userSpaceOnUse">
